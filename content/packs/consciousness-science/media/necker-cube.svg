<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 240 200" role="img" aria-label="A Necker cube: a wire-frame cube drawn without depth cues">
  <rect width="240" height="200" fill="#151a2e"/>
  <g fill="none" stroke="#e9e6f5" stroke-width="3" stroke-linejoin="round">
    <rect x="50" y="70" width="100" height="100"/>
    <rect x="90" y="30" width="100" height="100"/>
    <line x1="50" y1="70" x2="90" y2="30"/>
    <line x1="150" y1="70" x2="190" y2="30"/>
    <line x1="50" y1="170" x2="90" y2="130"/>
    <line x1="150" y1="170" x2="190" y2="130"/>
  </g>
</svg>
